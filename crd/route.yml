apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: faredgeroutes.embserve.fhp.pt
spec:
  scope: Namespaced
  group: embserve.fhp.pt
  names:
    kind: FarEdgeRoute
    plural: faredgeroutes
    singular: faredgeroute
    shortNames:
      - fers
      - fer
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              x-kubernetes-preserve-unknown-fields: true
              properties:
                # Single -> Creates a single route (egress -> ingress) even if we match multiple pods
                # SingleAll -> Creates a single route per egress match (all egress traffic will go to ingress pods). If we match multiple ingress pods, randomly choosen 
                # Pub -> A egress route will be created for all matched ingress pods. Only a single service will push data to all ingress pods 
                # Pull -> A ingress route will be created for all matched egress pods. Only a single service will receive all data from egress pods
                # All -> All egress pods will go to all ingress pods
                route_type: 
                  type: string
                  enum:
                    - "single"
                    - "single-all"
                    - "pub"
                    - "pull"
                    - "all"
                egress:
                  type: object
                  properties:
                    # This is the name of the "pod" which contains the "container" which will send data 
                    pod_name:
                      type: string
                    # This is an alternative way to get the "pod". If pod_name is available, this is ignored
                    pod_labels:
                      type: object
                      additionalProperties:
                        type: string
                    # This is the name of the "container" which will send data 
                    service_name:
                      type: string
                    # This is the key of the output value of the service
                    service_key:
                      type: string
                  required:
                  - service_name
                  - service_key

                ingress:
                  type: object
                  properties:
                    # This is the name of the "pod" which contains the "container" which will receive data 
                    pod_name:
                      type: string
                    # This is an alternative way to get the "pod". If pod_name is available, this is ignored
                    pod_labels:
                      type: object
                      additionalProperties:
                        type: string
                    # This is the name of the "container" which will receive the data 
                    service_name:
                      type: string
                    # This is the key of the input value to the service
                    service_key:
                      type: string
                  required:
                  - service_name
                  - service_key
              required:
              - route_type
              - egress
              - ingress      
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
