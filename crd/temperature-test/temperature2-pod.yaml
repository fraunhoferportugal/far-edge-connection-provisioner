apiVersion: v1
kind: Pod
metadata:
  name: temperature-2
spec:
  containers:
  - name: temperature-2
    image: fhp/temperature_sensor:0.0.2
    imagePullPolicy: IfNotPresent
  nodeSelector:
    extra.resources.fhp/embserve: "true"
    extra.resources.fhp/temperature_sensor: "true"
    # kubernetes.io/hostname: labnuc01-b1-node2
  tolerations:
  - key: "fita.fhp.pt/type"
    operator: "Equal"
    value: "far-edge"
    effect: "NoSchedule"