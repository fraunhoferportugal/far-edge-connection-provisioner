apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "far-edge-connection-provisioner.fullname" . }}
  labels:
    {{- include "far-edge-connection-provisioner.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]

  - apiGroups: ["embserve.fhp.pt"]
    resources: ["faredgeroutes"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  - apiGroups: ["embserve.fhp.pt"]
    resources: ["faredgeroutes/status", "faredgeroutes/finalizers"]
    verbs: ["get", "update", "patch"]

  {{- if .Values.role.extraRules }}
  {{- toYaml .Values.role.extraRules | nindent 2 }}
  {{- end }}
