apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "far-edge-connection-provisioner.fullname" . }}
  labels:
    {{- include "far-edge-connection-provisioner.labels" . | nindent 4 }}
rules:
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "watch"]

  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch"]

  {{- if .Values.clusterRole.extraRules }}
  {{- toYaml .Values.clusterRole.extraRules | nindent 2 }}
  {{- end }}
